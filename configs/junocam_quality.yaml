  exclusions:
    - orbit_min: 47
      orbit_max: 47
      product_pattern: '_47(?:C00001|M00002)_V[0-9]+$'
      reason: PJ47 turn-on failure affected the first RGB and methane products
      source: https://planetarydata.jpl.nasa.gov/img/data/juno/JNOJNC_0035/ERRATA.TXT#A24
    - orbit_min: 48
      orbit_max: 48
      sequence_max: 214
      reason: PJ48 failed turn-on interval through sequence 214
      source: https://planetarydata.jpl.nasa.gov/img/data/juno/JNOJNC_0035/ERRATA.TXT#A25
    - orbit_min: 49
      orbit_max: 49
      product_pattern: '_49C00116_V[0-9]+$'
      reason: Documented ECC block corruption
      source: https://planetarydata.jpl.nasa.gov/img/data/juno/JNOJNC_0035/ERRATA.TXT
    - orbit_min: 73
      orbit_max: 73
      sequence_min: 13
      reason: Radiation noise documented from PJ73 sequence 13
      source: https://planetarydata.jpl.nasa.gov/img/data/juno/JNOJNC_0035/ERRATA.TXT
    - orbit_min: 74
      orbit_max: 74
      sequence_min: 8
      reason: Content-free image interval starts at PJ74 sequence 8
      radiometry_invalid: true
      source: https://planetarydata.jpl.nasa.gov/img/data/juno/JNOJNC_0035/ERRATA.TXT
    - orbit_min: 75
      orbit_max: 80
      reason: Content-free images and invalid RDR radiometry
      radiometry_invalid: true
      source: https://planetarydata.jpl.nasa.gov/img/data/juno/JNOJNC_0035/ERRATA.TXT
  rationale_patterns:
    - 'content[- ]free'
    - 'all[- ]black'
    - 'over[- ]?saturat'
    - '\bsaturat(?:ed|ion)\b'
    - 'radiometr(?:y|ic).*invalid|invalid.*radiometr'
    - 'corrupt(?:ed|ion)?'
    - 'instrument.*fail|regulator.*damage|ccd.*damage'
    - 'no (?:useful |valid )?(?:image |radiometric )?signal'
